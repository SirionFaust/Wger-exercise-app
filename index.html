<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fitness Exercise Finder</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1 id="pageTitle">Fitness Exercise Finder</h1>
    </header>
    <section>
      <select id="muscleSelect">
        <option value="">Select Muscle</option>
        <option value="1">biceps</option>
        <option value="6">abs</option>
        <option value="5">triceps</option>
      </select>

      <select id="equipmentSelect">
        <option value="">Select Equipment</option>
        <option value="3">dumbbells</option>
        <option value="7">bodyweight</option>
        <option value="11">machine</option>
      </select>
      <button id="searchBtn">search</button>
    </section>
    <div id="resultsContainer"></div>
    <script src="script.js"></script>
  </body>
</html>
